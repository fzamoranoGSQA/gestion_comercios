{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contraseña restablecida - Gestión Comercios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #198754, #157347);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-reset {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            width: 90px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="card-reset">
        <img src="{% static 'images/GSQA.png' %}" alt="Logo" class="logo">
        <h4 class="text-success fw-bold mb-3">Contraseña actualizada</h4>

        <p class="text-muted mb-4">
            Tu contraseña se ha restablecido correctamente.  
            Ahora puedes iniciar sesión con tus nuevas credenciales.
        </p>

        <a href="{% url 'login' %}" class="btn btn-success w-100">Ir al inicio de sesión</a>
    </div>
</body>
</html>
