{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>

    <!-- Favicon personalizado -->
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #bcd0c7, #bcd0c7);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-reset {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            padding: 40px 30px;
            width: 400%;
            max-width: 500px;
        }
        .logo {
            width: 160px;
            display: block;
            margin: 0 auto 60px auto;
        }
        .btn-success {
            background-color: #157347;
            border: none;
        }
        .btn-success:hover {
            background-color: #146c43;
        }
        .text-success {
            color: #157347 !important;
        }
    </style>
</head>
<body>
    <div class="card-reset text-center">
        <!-- LOGO -->
        <img src="{% static 'images/GSQA.png' %}" alt="Logo" class="logo">

        <!-- TÍTULO -->
        <h4 class="mb-3 text-success fw-bold">Recuperar Contraseña</h4>

        <!-- DESCRIPCIÓN -->
        <p class="text-muted mb-4">
            Ingresa el correo electrónico asociado a tu cuenta.  
            Te enviaremos un enlace para restablecer tu contraseña.
        </p>

        <!-- FORMULARIO -->
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 mt-2">
                <i class="bi bi-send"></i> Enviar enlace
            </button>
        </form>

        <!-- VOLVER AL LOGIN -->
        <div class="mt-3">
            <a href="{% url 'login' %}" class="text-decoration-none text-success fw-semibold">
                <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
            </a>
        </div>
    </div>
</body>
</html>
