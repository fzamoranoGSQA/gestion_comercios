{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Correo Enviado - Gestión Comercios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #bcd0c7, #bcd0c7);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-reset {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            padding: 40px;
            width: 400%;
            max-width: 500px;
            text-align: center;
        }
        .logo {
            width: 160px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="card-reset">
        <img src="{% static 'images/GSQA.png' %}" alt="Logo" class="logo">
        <h4 class="text-success fw-bold">Correo enviado</h4>
        <p class="text-muted mt-3">
            Si el correo ingresado está asociado a una cuenta, recibirás un enlace para restablecer tu contraseña.
        </p>
        <a href="{% url 'login' %}" class="btn btn-success w-100 mt-3">Volver al inicio de sesión</a>
    </div>
</body>
</html>
