{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Comercio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: "Segoe UI", Roboto, sans-serif;
        }
        .container {
            max-width: 900px;
            margin-top: 50px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .form-label {
            font-weight: 600;
            color: #333;
        }
        .btn-primary {
            background-color: #0069d9;
            border-color: #0062cc;
            border-radius: 10px;
            padding: 8px 25px;
        }
        .btn-secondary {
            border-radius: 10px;
            padding: 8px 25px;
        }
        h2 {
            color: #004085;
            font-weight: bold;
        }
        .messages {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">Registrar Nuevo Comercio</h2>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'crear_comercio' %}">
            {% csrf_token %}
            
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre *</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">UEN</label>
                    <input type="text" name="uen" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select">
                        <option value="">Seleccione...</option>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Tipo</label>
                    <select name="tipo" class="form-select">
                        <option value="">Seleccione...</option>
                        <option value="Nuevo">Nuevo</option>
                        <option value="Migración">Migración</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">País</label>
                    <input type="text" name="pais" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Periodo de Ejecución</label>
                    <input type="text" name="periodo_ejecucion" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Hora de Ejecución</label>
                    <input type="time" name="hora_ejecucion" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Hora de Reintentos</label>
                    <input type="time" name="hora_reintentos" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Periodo Centinela</label>
                    <input type="text" name="periodo_centinela" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Hora Centinela</label>
                    <input type="time" name="hora_centinela" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Nombre Servidor</label>
                    <input type="text" name="nombre_servidor" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Ubicación Servidor</label>
                    <input type="text" name="ubicacion_servidor" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Estado Soporte</label>
                    <input type="text" name="estado_soporte" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Fecha Inicio Soporte</label>
                    <input type="date" name="fecha_inicio_soporte" class="form-control">
                </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'dashboard' %}" class="btn btn-secondary">← Volver</a>
                <button type="submit" class="btn btn-primary">Guardar Comercio</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
