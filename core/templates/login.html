{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de Sesión - Gestión Comercios</title>

    <!-- Favicon personalizado -->
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #bcd0c7, #bcd0c7);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            padding: 60px;
            width: 80%;
            max-width: 400px;
        }
        .logo {
            width: 160px;
            display: block;
            margin: 0 auto 20px auto;
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <!-- LOGO -->
        <img src="{% static 'images/GSQA.png' %}" alt="Logo" class="logo">
        <h4 class="mb-3 text-success">Gestión de Comercios</h4>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-1">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">{% csrf_token %}
            <div class="form-floating mb-3">
                <input type="text" name="username" class="form-control" id="username" placeholder="Usuario" required>
                <label for="username"><i class="bi bi-person"></i> Usuario</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" name="password" class="form-control" id="password" placeholder="Contraseña" required>
                <label for="password"><i class="bi bi-lock"></i> Contraseña</label>
            </div>

            <button class="btn btn-success w-100 mb-3">Iniciar Sesión</button>

            <div>
                <a href="{% url 'password_reset' %}" class="text-decoration-none text-success">
                    <i class="bi bi-key"></i> Olvidé mi contraseña
                </a>
            </div>
        </form>
    </div>
</body>
</html>
